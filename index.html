<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>谢语晴</title>
<style>
  :root{
    --ink:#3a2028;
    --ink2:#6b4a55;
    --rose:#c97f8f;
    --rose2:#e8aebc;
    --cream:#fbf6f3;
    --champagne:#c8a97e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    color:var(--ink);overflow:hidden;user-select:none;
    font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;
    background:
      radial-gradient(60% 45% at 18% 12%, #ffe3ea 0%, transparent 60%),
      radial-gradient(55% 40% at 88% 8%, #ffe9d9 0%, transparent 62%),
      radial-gradient(70% 55% at 78% 92%, #f6dfe9 0%, transparent 65%),
      radial-gradient(60% 50% at 8% 88%, #efe2f4 0%, transparent 60%),
      linear-gradient(160deg,#fdf8f5 0%,#fbeef1 55%,#f7e6ee 100%);
    display:flex;align-items:center;justify-content:center;
  }
  /* 柔光斑 */
  .blob{position:fixed;border-radius:50%;filter:blur(42px);opacity:.55;
    pointer-events:none;z-index:0;animation:drift 18s ease-in-out infinite}
  .b1{width:46vw;height:46vw;left:-10vw;top:6vh;background:#ffd6e2}
  .b2{width:38vw;height:38vw;right:-8vw;top:18vh;background:#ffe4cf;animation-delay:-6s}
  .b3{width:42vw;height:42vw;left:30vw;bottom:-14vh;background:#eadcf7;animation-delay:-11s}
  @keyframes drift{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(3vw,-3vh) scale(1.08)}
  }
  /* 细颗粒 */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;z-index:8;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* 飘落的花瓣 */
  #petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
  .petal{position:absolute;top:-6vh;width:14px;height:18px;
    background:linear-gradient(160deg,#ffd7e1,#ffb9cb);
    border-radius:60% 40% 55% 45%/60% 55% 45% 40%;
    opacity:0;animation:fall linear infinite}
  @keyframes fall{
    0%{transform:translate(0,0) rotate(0);opacity:0}
    10%{opacity:.65}
    50%{transform:translate(6vw,52vh) rotate(180deg)}
    100%{transform:translate(-4vw,108vh) rotate(360deg);opacity:0}
  }

  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    max-width:620px;margin:0 auto;padding:0 34px;z-index:3}

  .scene{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:20px;text-align:center;
    padding:0 34px;opacity:0;visibility:hidden;
    transition:opacity 1s ease,visibility 1s;pointer-events:none}
  .scene.on{opacity:1;visibility:visible}

  .name{font-size:15px;letter-spacing:.62em;text-indent:.62em;color:var(--rose)}
  .line{font-size:22px;line-height:2.1;letter-spacing:.1em;opacity:0;
    transform:translateY(12px);animation:rise 1.2s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .dim{color:var(--ink2);font-size:15px;letter-spacing:.22em}
  .rule{width:38px;height:1px;background:linear-gradient(90deg,transparent,var(--rose2),transparent)}
  .display{font-size:44px;letter-spacing:.26em;text-indent:.26em;line-height:1.5}
  .sub{font-size:16px;letter-spacing:.2em;color:var(--ink2)}

  .hint{position:fixed;left:0;right:0;bottom:max(30px,env(safe-area-inset-bottom));
    text-align:center;font-size:11px;letter-spacing:.42em;color:#b08d99;
    animation:fade 3.2s ease-in-out infinite;pointer-events:none;z-index:6}
  @keyframes fade{0%,100%{opacity:.3}50%{opacity:.8}}
  .meta{position:fixed;left:0;right:0;top:max(26px,env(safe-area-inset-top));
    text-align:center;font-size:10px;letter-spacing:.5em;color:#c2a3ad;z-index:6}
  #sound{position:fixed;right:20px;top:max(20px,env(safe-area-inset-top));
    width:38px;height:38px;border-radius:50%;z-index:7;
    border:1px solid rgba(201,127,143,.35);color:var(--rose);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;background:rgba(255,255,255,.55)}
  .bar{position:fixed;left:34px;right:34px;bottom:16px;height:1px;
    background:rgba(201,127,143,.18);z-index:6}
  .bar i{display:block;height:100%;width:0;background:var(--rose2);
    transition:width .8s cubic-bezier(.2,.7,.2,1);opacity:.9}

  /* 最后一屏 */
  .scene.photo{padding:0;justify-content:flex-end;gap:12px}
  .scene.photo .ph{position:absolute;inset:0;background-image:
      linear-gradient(180deg,rgba(251,246,243,.05) 0%,rgba(90,50,62,.12) 42%,rgba(58,32,40,.9) 100%),
      var(--photo);
    background-size:cover,cover;background-position:center top,center 16%;
    background-repeat:no-repeat}
  .scene.photo .cap{position:relative;z-index:2;padding:0 34px 84px;
    display:flex;flex-direction:column;gap:12px;align-items:center}
  .scene.photo .display{color:#fff;text-shadow:0 3px 24px rgba(40,15,25,.5)}
  .scene.photo .line{color:#fff;text-shadow:0 2px 18px rgba(40,15,25,.5)}
  .scene.photo .sub{color:#f0dfe4}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div id="petals"></div>

<div class="meta">X I E &nbsp; Y U &nbsp; Q I N G</div>
<div id="sound">♪</div>

<div id="stage">
  <section class="scene on">
    <div class="name">谢语晴</div>
    <div class="rule"></div>
    <div class="dim">有句话，想认真说</div>
  </section>

  <section class="scene">
    <div class="line">你身上有一种很轻的萌，<br>不吵，也不刻意。</div>
  </section>

  <section class="scene">
    <div class="line">说话时尾音会软下来，<br>笑起来眼睛先亮起来。</div>
  </section>

  <section class="scene">
    <div class="line">别人可爱是表情，<br>你的可爱是习惯。</div>
  </section>

  <section class="scene">
    <div class="line">你认真做事的样子，<br>比卖萌更萌。</div>
  </section>

  <section class="scene">
    <div class="line">我见过很多好看的人，<br>但「萌」这个字，好像只对你成立。</div>
  </section>

  <section class="scene">
    <div class="dim">所以——</div>
    <div class="rule"></div>
  </section>

<div class="hint" id="hint">轻触继续</div>
<div class="bar"><i id="bar"></i></div>

<script>
(function(){
  /* 花瓣 */
  var box=document.getElementById('petals');
  for(var i=0;i<14;i++){
    var p=document.createElement('div');
    p.className='petal';
    p.style.left=(Math.random()*100)+'%';
    p.style.animationDuration=(11+Math.random()*10)+'s';
    p.style.animationDelay=(-Math.random()*16)+'s';
    var s=0.6+Math.random()*0.9;
    p.style.transform='scale('+s+')';
    p.style.opacity=0;
    box.appendChild(p);
  }

  /* 氛围音乐（音量比上一版大） */
  var AC=null, master=null, muted=false, started=false;
  function ensureAudio(){
    if(AC){ if(AC.state==='suspended') AC.resume(); return AC; }
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();
      master.gain.value=0.0001;
      master.connect(AC.destination);
      master.gain.exponentialRampToValueAtTime(0.34, AC.currentTime+3);
    }catch(e){ AC=null; }
    return AC;
  }
  function pad(freqs,dur){
    if(!AC||muted) return;
    var t0=AC.currentTime;
    var filt=AC.createBiquadFilter();
    filt.type='lowpass'; filt.frequency.value=1100;
    filt.connect(master);
    freqs.forEach(function(f,i){
      var o=AC.createOscillator(), g=AC.createGain();
      o.type = i%2 ? 'sine' : 'triangle';
      o.frequency.value=f;
      o.detune.value=(i%2?4:-4);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.06,t0+2.0);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g); g.connect(filt);
      o.start(t0); o.stop(t0+dur+0.2);
    });
  }
  function bell(f){
    if(!AC||muted) return;
    var t0=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(0.07,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+2.4);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0+2.6);
  }
  function loopMusic(){
    var chords=[
      [146.83,220.00,277.18,349.23],
      [123.47,185.00,246.94,293.66],
      [98.00,146.83,196.00,246.94],
      [110.00,164.81,220.00,277.18]
    ];
    var i=0;
    function step(){
      if(!AC||muted) return;
      pad(chords[i%chords.length], 9.5);
      var bells=[587.33,659.25,783.99,880.00];
      setTimeout(function(){ bell(bells[i%bells.length]); }, 2400);
      i++;
    }
    step();
    setInterval(step, 9000);
  }
  function startMusic(){
    if(started) return;
    started=true;
    if(!ensureAudio()) return;
    loopMusic();
  }

  /* 翻页 */
  var scenes=[].slice.call(document.querySelectorAll('.scene'));
  var hint=document.getElementById('hint');
  var bar=document.getElementById('bar');
  var idx=0;
  function render(){
    scenes.forEach(function(s,i){
      s.classList.toggle('on',i===idx);
      if(i===idx){
        var els=s.querySelectorAll('.line,.name,.dim,.display,.sub,.rule');
        els.forEach(function(el,k){
          el.style.animation='none'; void el.offsetWidth;
          el.style.animation='rise 1.2s cubic-bezier(.2,.7,.2,1) both';
          el.style.animationDelay=(k*0.18)+'s';
        });
      }
    });
    bar.style.width=Math.round(idx/(scenes.length-1)*100)+'%';
    hint.style.display = idx===scenes.length-1 ? 'none' : 'block';
  }
  function next(){ if(idx>=scenes.length-1) return; idx++; render(); }

  document.body.addEventListener('pointerup',function(e){
    if(e.target && e.target.id==='sound') return;
    startMusic(); next();
  });
  document.getElementById('sound').addEventListener('pointerup',function(e){
    e.stopPropagation();
    if(!started){ startMusic(); return; }
    muted=!muted;
    if(master){
      var t=AC.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setValueAtTime(master.gain.value,t);
      master.gain.exponentialRampToValueAtTime(muted?0.0001:0.34,t+0.35);
    }
    e.currentTarget.textContent = muted ? '×' : '♪';
  });

  render();
})();
</script>
